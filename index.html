
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบันทึกการใช้งานของนักเรียน</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,Tahoma,sans-serif;
 background:#eef3f8;color:#243247;
}
header{
 background:linear-gradient(135deg,#123b67,#1976a8);
 color:white;text-align:center;padding:25px 15px;
}
header h2{margin:0 0 8px;font-size:23px}
header p{margin:0;font-size:14px}
.container{max-width:720px;margin:22px auto;padding:0 14px}
.card{
 background:white;border-radius:17px;padding:22px;
 box-shadow:0 5px 20px #1c36521a;margin-bottom:18px;
}
h3{margin-top:0;color:#174d78}
label{display:block;font-weight:bold;margin:15px 0 7px}
select,input{
 width:100%;padding:13px;border:1px solid #cbd5e1;
 border-radius:10px;font-size:16px;background:white;
}
.purpose{
 display:flex;gap:12px;align-items:center;
 border:1px solid #dce5ef;padding:14px;
 border-radius:12px;margin:10px 0;cursor:pointer;
}
.purpose input{width:20px;height:20px}
.purpose span{font-size:15px;line-height:1.5}
button{
 border:0;border-radius:11px;padding:14px;
 font-size:16px;font-weight:bold;cursor:pointer;
}
.save{
 width:100%;margin-top:20px;color:white;
 background:linear-gradient(135deg,#087e50,#12a66a);
}
.save:disabled{opacity:.5}
.secondary{
 background:#e4edf5;color:#174d78;
 padding:10px 15px;font-size:14px;
}
.time{
 background:#edf6ff;padding:14px;border-radius:12px;
 text-align:center;color:#14558a;
}
#clock{font-size:25px;font-weight:bold}
#date{font-size:14px;margin-top:5px}
.status{text-align:center;padding:12px;border-radius:10px;
 margin-top:14px;display:none}
.success{display:block;background:#e0f7e9;color:#087443}
.error{display:block;background:#ffeded;color:#b42318}
.record{
 padding:13px 0;border-bottom:1px solid #e5eaf0;
 font-size:14px;line-height:1.7
}
footer{text-align:center;color:#78899b;font-size:12px;padding:20px}
</style>
</head>
<body>

<header>
 <h2>ระบบบันทึกการใช้งานของนักเรียน</h2>
 <p>โรงเรียนบ้านชาด สพป.อบ.3</p>
</header>

<div class="container">

<div class="card">
 <div class="time">
  <div>วันและเวลาปัจจุบัน</div>
  <div id="clock">--:--:--</div>
  <div id="date">กำลังโหลด...</div>
 </div>

 <h3 style="margin-top:22px">บันทึกข้อมูลนักเรียน</h3>

 <label>1. เลือกระดับชั้น</label>
 <select id="classSelect">
  <option value="">-- เลือกระดับชั้น --</option>
  <option>ป.1</option>
  <option>ป.2</option>
  <option>ป.3</option>
  <option>ป.4</option>
  <option>ป.5</option>
  <option>ป.6</option>
 </select>

 <label>2. เลือกชื่อนักเรียน</label>
 <select id="studentSelect" disabled>
  <option value="">-- กรุณาเลือกชั้นเรียนก่อน --</option>
 </select>

 <label>3. วัตถุประสงค์การใช้งาน</label>

 <label class="purpose">
  <input type="radio" name="purpose" value="ใช้ค้นหาข้อมูลที่เป็นประโยชน์ในอินเทอร์เน็ต">
  <span>ใช้ค้นหาข้อมูลที่เป็นประโยชน์ในอินเทอร์เน็ต</span>
 </label>

 <label class="purpose">
  <input type="radio" name="purpose" value="ใช้เรียนวิชาวิทยาการคำนวณ">
  <span>ใช้เรียนวิชาวิทยาการคำนวณ</span>
 </label>

 <label class="purpose">
  <input type="radio" name="purpose" value="ใช้งานโซเชียลมีเดีย">
  <span>ใช้งานโซเชียลมีเดีย</span>
 </label>

 <button class="save" id="saveBtn" onclick="saveData()">
  บันทึกข้อมูล
 </button>

 <div id="status" class="status"></div>
</div>

<div class="card">
 <h3>ประวัติการบันทึกล่าสุด</h3>
 <div id="history">ยังไม่มีข้อมูลในหน้านี้</div>
 <button class="secondary" onclick="clearHistory()">ล้างประวัติบนหน้าจอ</button>
</div>

</div>

<footer>
ระบบบันทึกข้อมูลการใช้งานห้องคอมพิวเตอร์<br>
พัฒนาโดย ครูปรเมศวร์ ฟองลม
</footer>

<script>
// ===================================
// ตั้งค่า Google Apps Script
// ===================================
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyCHt1z4W_MP-shMITxTZuhTWpO5S6ZFHkkN68BNshINyJVG06soDNHlc4KqLTDP-E8cw/exec";

// รายชื่อนักเรียนโหลดจาก Google Sheets
let students = [];

// ===================================
// แสดงวันและเวลาปัจจุบัน
// ===================================
function updateClock(){
 const now = new Date();
 document.getElementById("clock").textContent =
 now.toLocaleTimeString("th-TH",{hour12:false});

 document.getElementById("date").textContent =
 now.toLocaleDateString("th-TH",{
  day:"numeric",month:"long",year:"numeric"
 });
}
updateClock();
setInterval(updateClock,1000);

// ===================================
// โหลดรายชื่อนักเรียนผ่าน JSONP
// ===================================
function loadStudents(){
 const script = document.createElement("script");
 const callback = "__studentCallback";

 window[callback] = function(result){
  if(result && result.success && Array.isArray(result.students)){
   students = result.students;
   document.getElementById("studentSelect").disabled = false;
   document.getElementById("studentSelect").innerHTML =
    '<option value="">-- เลือกชื่อนักเรียน --</option>';
  }else{
   showStatus("ไม่สามารถโหลดรายชื่อนักเรียนได้","error");
  }
  script.remove();
  delete window[callback];
 };

 script.onerror = function(){
  showStatus("เชื่อมต่อรายชื่อนักเรียนไม่ได้ กรุณาตรวจสอบ Apps Script","error");
  script.remove();
  delete window[callback];
 };

 script.src = SCRIPT_URL +
  "?action=students&callback="+callback+"&_="+Date.now();

 document.body.appendChild(script);
}

// ===================================
// เลือกชั้นเรียนและแสดงรายชื่อ
// ===================================
document.getElementById("classSelect").addEventListener("change",function(){
 const selectedClass = this.value;
 const select = document.getElementById("studentSelect");

 select.innerHTML = '<option value="">-- เลือกชื่อนักเรียน --</option>';

 students.filter(s=>s.className===selectedClass)
 .forEach(s=>{
  const option = document.createElement("option");
  option.value = s.studentId;
  option.textContent = s.name;
  select.appendChild(option);
 });
});

// ===================================
// บันทึกข้อมูล
// ===================================
async function saveData(){
 const className = document.getElementById("classSelect").value;
 const studentId = document.getElementById("studentSelect").value;
 const student = students.find(s=>s.studentId===studentId);
 const purpose = document.querySelector('input[name="purpose"]:checked');
 const btn = document.getElementById("saveBtn");

 if(!className || !student){
  showStatus("กรุณาเลือกระดับชั้นและชื่อนักเรียน","error");
  return;
 }
 if(!purpose){
  showStatus("กรุณาเลือกวัตถุประสงค์การใช้งาน","error");
  return;
 }

 const now = new Date();

 const data = {
  action:"save",
  studentId:student.studentId,
  name:student.name,
  className:className,
  purpose:purpose.value,
  timestamp:now.toISOString(),
  date:now.toLocaleDateString("th-TH"),
  time:now.toLocaleTimeString("th-TH",{hour12:false})
 };

 btn.disabled = true;
 btn.textContent = "กำลังบันทึก...";

 try{
  await fetch(SCRIPT_URL,{
   method:"POST",
   mode:"no-cors",
   headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify(data)
  });

  showStatus("ส่งคำขอบันทึกข้อมูลแล้ว กรุณาตรวจสอบ Google Sheets","success");

  addHistory(data);

  document.getElementById("studentSelect").value="";
  document.querySelectorAll('input[name="purpose"]').forEach(el=>el.checked=false);

 }catch(error){
  showStatus("เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองอีกครั้ง","error");
 }finally{
  btn.disabled=false;
  btn.textContent="บันทึกข้อมูล";
 }
}

// ===================================
// แสดงสถานะ
// ===================================
function showStatus(message,type){
 const el=document.getElementById("status");
 el.textContent=message;
 el.className="status "+type;
}

// ===================================
// ประวัติบนหน้าจอ
// ===================================
function addHistory(data){
 const history=document.getElementById("history");
 if(history.textContent==="ยังไม่มีข้อมูลในหน้านี้"){
  history.textContent="";
 }

 const item=document.createElement("div");
 item.className="record";

 const title=document.createElement("strong");
 title.textContent=data.name+" ("+data.className+")";

 const detail=document.createElement("div");
 detail.textContent=data.purpose;

 const time=document.createElement("div");
 time.textContent=data.date+" "+data.time;

 item.append(title,detail,time);
 history.prepend(item);
}

function clearHistory(){
 document.getElementById("history").textContent="ยังไม่มีข้อมูลในหน้านี้";
}

// เริ่มโหลดข้อมูล
loadStudents();
</script>
</body>
</html>
