<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบบันทึกการใช้งานของนักเรียน | โรงเรียนบ้านชาด</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#243247;font-family:Tahoma,Arial,sans-serif}
header{background:linear-gradient(135deg,#123b67,#1976a8);color:#fff;text-align:center;padding:25px 15px}
header h1{font-size:23px;margin:0 0 8px}header p{margin:0;font-size:14px}
.container{max-width:720px;margin:22px auto;padding:0 14px}.card{background:#fff;border-radius:17px;padding:22px;box-shadow:0 5px 20px #1c36521a;margin-bottom:18px}
h2{margin:0 0 16px;color:#174d78;font-size:20px}label.field{display:block;font-weight:bold;margin:16px 0 7px}
select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:#fff}
.clock{background:#edf6ff;padding:14px;border-radius:12px;text-align:center;color:#14558a}.clock strong{display:block;font-size:26px;margin:5px}
.purpose{display:flex;gap:12px;align-items:center;border:1px solid #dce5ef;padding:14px;border-radius:12px;margin:10px 0;cursor:pointer;font-weight:normal}
.purpose input{width:20px;height:20px;flex:none}.purpose span{font-size:15px;line-height:1.5}
button{border:0;border-radius:11px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}
.save{width:100%;margin-top:20px;color:#fff;background:linear-gradient(135deg,#087e50,#12a66a)}.save:disabled{opacity:.55;cursor:wait}
.status{display:none;text-align:center;padding:12px;border-radius:10px;margin-top:14px}.success{display:block;background:#e0f7e9;color:#087443}.error{display:block;background:#ffeded;color:#b42318}
.record{padding:12px 0;border-bottom:1px solid #e5eaf0;font-size:14px;line-height:1.7}.muted{color:#718096;font-size:13px}
footer{text-align:center;color:#78899b;font-size:12px;padding:20px}
</style>
</head>
<body>
<header><h1>ระบบบันทึกการใช้งานของนักเรียน</h1><p>โรงเรียนบ้านชาด สพป.อบ.3</p></header>
<main class="container">
<section class="card">
 <div class="clock"><div>วันและเวลาปัจจุบัน</div><strong id="clock">--:--:--</strong><div id="date">กำลังโหลด...</div></div>
 <h2 style="margin-top:22px">บันทึกข้อมูลนักเรียน</h2>
 <label class="field" for="classSelect">1. เลือกระดับชั้น</label>
 <select id="classSelect"><option value="">-- เลือกระดับชั้น --</option><option>ป.1</option><option>ป.2</option><option>ป.3</option><option>ป.4</option><option>ป.5</option><option>ป.6</option></select>
 <label class="field" for="studentSelect">2. เลือกชื่อนักเรียน</label>
 <select id="studentSelect" disabled><option value="">-- กรุณาเลือกระดับชั้นก่อน --</option></select>
 <div id="studentCount" class="muted" aria-live="polite"></div>
 <label class="field">3. วัตถุประสงค์การใช้งาน</label>
 <label class="purpose"><input type="radio" name="purpose" value="ใช้ค้นหาข้อมูลที่เป็นประโยชน์ในอินเทอร์เน็ต"><span>ใช้ค้นหาข้อมูลที่เป็นประโยชน์ในอินเทอร์เน็ต</span></label>
 <label class="purpose"><input type="radio" name="purpose" value="ใช้เรียนวิชาวิทยาการคำนวณ"><span>ใช้เรียนวิชาวิทยาการคำนวณ</span></label>
 <label class="purpose"><input type="radio" name="purpose" value="ใช้งานโซเชียลมีเดีย"><span>ใช้งานโซเชียลมีเดีย</span></label>
 <button class="save" id="saveBtn" type="button" onclick="saveData()">บันทึกข้อมูล</button>
 <div id="status" class="status" role="status"></div>
</section>
<section class="card"><h2>ประวัติการบันทึกในหน้านี้</h2><div id="history" class="muted">ยังไม่มีข้อมูลในหน้านี้</div><button type="button" onclick="clearHistory()" style="background:#e4edf5;color:#174d78;padding:10px 15px;font-size:14px">ล้างประวัติบนหน้าจอ</button></section>
</main>
<footer>ระบบบันทึกข้อมูลการใช้งานห้องคอมพิวเตอร์<br>พัฒนาโดย ครูปรเมศวร์ ฟองลม</footer>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCHt1z4W_MP-shMITxTZuhTWpO5S6ZFHkkN68BNshINyJVG06soDNHlc4KqLTDP-E8cw/exec";
let students = [];
function updateClock(){
 const now=new Date();
 document.getElementById("clock").textContent=now.toLocaleTimeString("th-TH",{hour12:false});
 document.getElementById("date").textContent=now.toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"});
}
updateClock();setInterval(updateClock,1000);
function showStatus(message,type){const el=document.getElementById("status");el.textContent=message;el.className="status "+type;}
function loadStudents(){
 const callback="studentCallback_"+Date.now();
 const script=document.createElement("script");
 window[callback]=result=>{
   if(result && result.success && Array.isArray(result.students)){
     students=result.students;
     document.getElementById("studentSelect").disabled=false;
     document.getElementById("studentCount").textContent="โหลดรายชื่อนักเรียนแล้ว "+students.length+" คน";
     showStatus("โหลดรายชื่อนักเรียนเรียบร้อย","success");
   }else showStatus((result&&result.message)||"ไม่สามารถโหลดรายชื่อนักเรียนได้","error");
   script.remove();delete window[callback];
 };
 script.onerror=()=>{showStatus("เชื่อมต่อรายชื่อนักเรียนไม่ได้ ตรวจสอบ URL และการ Deploy ของ Apps Script","error");script.remove();delete window[callback];};
 script.src=SCRIPT_URL+"?action=students&callback="+callback+"&_="+Date.now();
 document.body.appendChild(script);
}
document.getElementById("classSelect").addEventListener("change",function(){
 const cls=this.value,sel=document.getElementById("studentSelect");
 sel.innerHTML='<option value="">-- เลือกชื่อนักเรียน --</option>';
 const filtered=students.filter(s=>String(s.className).trim()===cls);
 filtered.forEach(s=>{const o=document.createElement("option");o.value=s.studentId;o.textContent=s.name;sel.appendChild(o);});
 document.getElementById("studentCount").textContent=cls?(filtered.length?"ชั้น "+cls+" มีนักเรียน "+filtered.length+" คน":"ยังไม่มีรายชื่อในชั้น "+cls):"";
});
async function saveData(){
 const cls=document.getElementById("classSelect").value;
 const id=document.getElementById("studentSelect").value;
 const student=students.find(s=>String(s.studentId)===String(id));
 const purpose=document.querySelector('input[name="purpose"]:checked');
 const btn=document.getElementById("saveBtn");
 if(!cls||!student){showStatus("กรุณาเลือกระดับชั้นและชื่อนักเรียน","error");return;}
 if(!purpose){showStatus("กรุณาเลือกวัตถุประสงค์การใช้งาน","error");return;}
 const payload={action:"save",studentId:student.studentId,name:student.name,className:cls,purpose:purpose.value};
 btn.disabled=true;btn.textContent="กำลังส่งข้อมูล...";
 try{
   // Apps Script รับข้อมูลผ่าน POST; no-cors ใช้ได้กับ Web App ที่ Deploy เป็น Anyone
   await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
   const now=new Date();
   const item={...payload,date:now.toLocaleDateString("th-TH"),time:now.toLocaleTimeString("th-TH",{hour12:false})};
   addHistory(item);
   showStatus("ส่งคำขอบันทึกแล้ว โปรดตรวจสอบแถวข้อมูลใน Google Sheets","success");
   document.getElementById("studentSelect").value="";
   document.querySelectorAll('input[name="purpose"]').forEach(x=>x.checked=false);
 }catch(err){showStatus("ส่งข้อมูลไม่สำเร็จ: "+err.message,"error");}
 finally{btn.disabled=false;btn.textContent="บันทึกข้อมูล";}
}
function addHistory(d){
 const box=document.getElementById("history");if(box.textContent==="ยังไม่มีข้อมูลในหน้านี้")box.textContent="";
 const row=document.createElement("div");row.className="record";
 const strong=document.createElement("strong");strong.textContent=d.name+" ("+d.className+")";
 const p=document.createElement("div");p.textContent=d.purpose;
 const t=document.createElement("div");t.className="muted";t.textContent=d.date+" "+d.time;
 row.append(strong,p,t);box.prepend(row);
}
function clearHistory(){document.getElementById("history").textContent="ยังไม่มีข้อมูลในหน้านี้";}
loadStudents();
</script>
</body></html>
